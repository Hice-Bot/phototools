<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Border - PhotoTools</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="../index.html">PHOTO TOOLS</a> / Add Border</h1>
    </header>
    <main class="tool-page">
      <div id="dropzoneArea"></div>
      <div class="controls" id="controls" style="display:none">
        <div>
          <label>Border Width (px)</label><br>
          <input type="range" id="borderWidth" min="1" max="100" value="20">
          <span id="borderWidthVal">20</span>
        </div>
        <div>
          <label>Border Color</label><br>
          <input type="color" id="borderColor" value="#000000">
        </div>
        <button class="btn" id="applyBtn">Apply</button>
      </div>
      <div class="info-bar" id="infoBar" style="display:none"></div>
      <div class="preview-area" id="previewArea"></div>
      <div id="downloadArea" style="margin-top:16px"></div>
    </main>
  </div>
  <script src="../js/app.js"></script>
  <script>
    let srcCanvas = null;

    document.getElementById('borderWidth').addEventListener('input', e => {
      document.getElementById('borderWidthVal').textContent = e.target.value;
    });

    createDropzone(document.getElementById('dropzoneArea'), async (file) => {
      srcCanvas = await fileToCanvas(file);
      document.getElementById('controls').style.display = 'flex';
      document.getElementById('infoBar').style.display = 'flex';
      document.getElementById('infoBar').textContent = `Source: ${srcCanvas.width} x ${srcCanvas.height}`;
      showPreview(document.getElementById('previewArea'), srcCanvas.toDataURL());
      document.getElementById('downloadArea').innerHTML = '';
    });

    document.getElementById('applyBtn').addEventListener('click', async () => {
      const border = parseInt(document.getElementById('borderWidth').value);
      const color = document.getElementById('borderColor').value;
      const out = document.createElement('canvas');
      out.width = srcCanvas.width + border * 2;
      out.height = srcCanvas.height + border * 2;
      const ctx = out.getContext('2d');
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.drawImage(srcCanvas, border, border);
      showPreview(document.getElementById('previewArea'), out.toDataURL());
      const blob = await new Promise(r => out.toBlob(r, 'image/png'));
      const f = new File([blob], 'bordered.png', { type: 'image/png' });
      document.getElementById('downloadArea').innerHTML = '';
      addDownloadButton(document.getElementById('downloadArea'), f, 'bordered.png');
    });
  </script>
</body>
</html>
