<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Style - PhotoTools</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="../index.html">PHOTO TOOLS</a> / AI Image Style</h1>
    </header>
    <main class="tool-page">
      <div id="dropzoneArea"></div>
      <div class="controls" id="controls" style="display:none; flex-direction:column; gap:16px">
        <div style="display:flex; gap:16px; flex-wrap:wrap">
          <div><label>Style</label><br>
          <select id="style">
            <option value="oil">Oil Painting</option>
            <option value="sketch">Pencil Sketch</option>
            <option value="cartoon">Cartoon</option>
            <option value="pixel">Pixel Art</option>
            <option value="poster">Posterize</option>
            <option value="emboss">Emboss</option>
            <option value="edge">Edge Detect</option>
            <option value="vintage">Vintage</option>
            <option value="dramatic">Dramatic B&W</option>
          </select></div>
          <div><label>Intensity</label><br>
          <input type="range" id="intensity" min="1" max="10" value="5"></div>
        </div>
        <div><button class="btn" id="applyBtn">Apply Style</button></div>
      </div>
      <div class="progress-bar" id="progress" style="display:none"><div class="fill" id="progressFill"></div></div>
      <div class="info-bar" id="infoBar" style="display:none"></div>
      <div class="preview-area" id="previewArea"></div>
      <div id="downloadArea" style="margin-top:16px"></div>
    </main>
  </div>
  <script src="../js/app.js"></script>
  <script>
    let srcCanvas = null;

    createDropzone(document.getElementById('dropzoneArea'), async (file) => {
      srcCanvas = await fileToCanvas(file);
      document.getElementById('controls').style.display = 'flex';
      document.getElementById('infoBar').style.display = 'flex';
      document.getElementById('infoBar').textContent = `${srcCanvas.width} x ${srcCanvas.height}`;
      showPreview(document.getElementById('previewArea'), srcCanvas.toDataURL());
      document.getElementById('downloadArea').innerHTML = '';
    });

    document.getElementById('applyBtn').addEventListener('click', async () => {
      if (!srcCanvas) return;
      const btn = document.getElementById('applyBtn');
      btn.disabled = true; btn.textContent = 'Processing...';
      document.getElementById('progress').style.display = 'block';
      document.getElementById('progressFill').style.width = '30%';

      try {
        const style = document.getElementById('style').value;
        const intensity = parseInt(document.getElementById('intensity').value);
        document.getElementById('progressFill').style.width = '60%';

        // Client-side style effects using Canvas pixel manipulation
        const w = srcCanvas.width, h = srcCanvas.height;
        const out = document.createElement('canvas');
        out.width = w; out.height = h;
        const ctx = out.getContext('2d');
        ctx.drawImage(srcCanvas, 0, 0);

        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;

        if (style === 'oil') {
          // Oil painting effect: quantize colors and blur
          const levels = Math.max(2, 12 - intensity);
          for (let i = 0; i < d.length; i += 4) {
            d[i] = Math.round(d[i] / levels) * levels;
            d[i+1] = Math.round(d[i+1] / levels) * levels;
            d[i+2] = Math.round(d[i+2] / levels) * levels;
          }
          ctx.putImageData(imgData, 0, 0);
          ctx.filter = `blur(${intensity * 0.5}px)`;
          ctx.drawImage(out, 0, 0);
          ctx.filter = 'none';
        }
        else if (style === 'sketch') {
          // Pencil sketch: grayscale + edge detect
          for (let i = 0; i < d.length; i += 4) {
            const gray = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
            d[i] = d[i+1] = d[i+2] = gray;
          }
          ctx.putImageData(imgData, 0, 0);
          // Edge detection via difference
          const src = ctx.getImageData(0, 0, w, h);
          ctx.filter = `blur(${Math.max(1, 3 - intensity)}px)`;
          ctx.drawImage(out, 0, 0);
          ctx.filter = 'none';
          const blurred = ctx.getImageData(0, 0, w, h);
          for (let i = 0; i < d.length; i += 4) {
            const diff = Math.abs(src.data[i] - blurred.data[i]);
            const val = Math.min(255, diff * intensity * 2);
            d[i] = d[i+1] = d[i+2] = 255 - val;
          }
          ctx.putImageData(imgData, 0, 0);
        }
        else if (style === 'cartoon') {
          // Posterize + edge overlay
          const levels = Math.max(2, 8 - intensity);
          for (let i = 0; i < d.length; i += 4) {
            d[i] = Math.round(d[i] / levels) * levels;
            d[i+1] = Math.round(d[i+1] / levels) * levels;
            d[i+2] = Math.round(d[i+2] / levels) * levels;
          }
          ctx.putImageData(imgData, 0, 0);
        }
        else if (style === 'pixel') {
          const pixelSize = Math.max(2, intensity * 2);
          const temp = document.createElement('canvas');
          const tw = Math.ceil(w / pixelSize), th = Math.ceil(h / pixelSize);
          temp.width = tw; temp.height = th;
          const tctx = temp.getContext('2d');
          tctx.drawImage(srcCanvas, 0, 0, tw, th);
          ctx.imageSmoothingEnabled = false;
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(temp, 0, 0, w, h);
          ctx.imageSmoothingEnabled = true;
          return finish(out);
        }
        else if (style === 'poster') {
          const levels = Math.max(2, 8 - intensity);
          for (let i = 0; i < d.length; i += 4) {
            d[i] = Math.round(d[i] * levels / 255) * (255 / levels);
            d[i+1] = Math.round(d[i+1] * levels / 255) * (255 / levels);
            d[i+2] = Math.round(d[i+2] * levels / 255) * (255 / levels);
          }
          ctx.putImageData(imgData, 0, 0);
        }
        else if (style === 'emboss') {
          const kernel = [-2,-1,0,-1,1,1,0,1,2];
          applyKernel(ctx, imgData, kernel, intensity, w, h);
        }
        else if (style === 'edge') {
          const kernel = [-1,-1,-1,-1,8,-1,-1,-1,-1];
          applyKernel(ctx, imgData, kernel, intensity, w, h);
        }
        else if (style === 'vintage') {
          for (let i = 0; i < d.length; i += 4) {
            d[i] = Math.min(255, d[i] * 1.1 + 20);
            d[i+1] = Math.min(255, d[i+1] * 0.9 + 10);
            d[i+2] = Math.min(255, d[i+2] * 0.7);
          }
          ctx.putImageData(imgData, 0, 0);
          ctx.filter = `sepia(${intensity * 10}%) contrast(${100 + intensity * 5}%)`;
          ctx.drawImage(out, 0, 0);
          ctx.filter = 'none';
        }
        else if (style === 'dramatic') {
          for (let i = 0; i < d.length; i += 4) {
            const gray = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
            const highContrast = ((gray / 255 - 0.5) * (1 + intensity * 0.3) + 0.5) * 255;
            d[i] = d[i+1] = d[i+2] = Math.max(0, Math.min(255, highContrast));
          }
          ctx.putImageData(imgData, 0, 0);
        }

        document.getElementById('progressFill').style.width = '90%';
        finish(out);

        function finish(canvas) {
          document.getElementById('progressFill').style.width = '100%';
          showPreview(document.getElementById('previewArea'), canvas.toDataURL());
          canvas.toBlob(async blob => {
            const f = new File([blob], 'styled.png', { type: 'image/png' });
            document.getElementById('downloadArea').innerHTML = '';
            addDownloadButton(document.getElementById('downloadArea'), f, 'styled.png');
            document.getElementById('infoBar').textContent = `Done — ${formatBytes(blob.size)}`;
          }, 'image/png');
          btn.disabled = false; btn.textContent = 'Apply Style';
          setTimeout(() => { document.getElementById('progress').style.display = 'none'; }, 1000);
        }
      } catch (e) {
        document.getElementById('infoBar').textContent = 'Error: ' + e.message;
        btn.disabled = false; btn.textContent = 'Apply Style';
        document.getElementById('progress').style.display = 'none';
      }
    });

    function applyKernel(ctx, imgData, kernel, intensity, w, h) {
      const src = new Uint8ClampedArray(imgData.data);
      const d = imgData.data;
      const kSum = kernel.reduce((a, b) => a + Math.abs(b), 0) || 1;
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          let r = 0, g = 0, b = 0;
          for (let ky = -1; ky <= 1; ky++) {
            for (let kx = -1; kx <= 1; kx++) {
              const pi = ((y + ky) * w + (x + kx)) * 4;
              const ki = (ky + 1) * 3 + (kx + 1);
              r += src[pi] * kernel[ki];
              g += src[pi+1] * kernel[ki];
              b += src[pi+2] * kernel[ki];
            }
          }
          const i = (y * w + x) * 4;
          const blend = intensity / 10;
          d[i] = Math.min(255, Math.max(0, src[i] * (1-blend) + (r/kSum) * blend + 128 * blend));
          d[i+1] = Math.min(255, Math.max(0, src[i+1] * (1-blend) + (g/kSum) * blend + 128 * blend));
          d[i+2] = Math.min(255, Math.max(0, src[i+2] * (1-blend) + (b/kSum) * blend + 128 * blend));
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }
  </script>
</body>
</html>
