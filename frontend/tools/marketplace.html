<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace Presets - PhotoTools</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="../index.html">PHOTO TOOLS</a> / Marketplace Presets</h1>
    </header>
    <main class="tool-page">
      <div id="dropzoneArea"></div>
      <div class="controls" id="controls" style="display:none">
        <div>
          <label>Marketplace</label><br>
          <select id="preset">
            <option value="2000x2000">Amazon (2000x2000)</option>
            <option value="2000x2000">Etsy (2000x2000)</option>
            <option value="1600x1600">eBay (1600x1600)</option>
            <option value="2048x2048">Shopify (2048x2048)</option>
            <option value="1000x1333">Poshmark (1000x1333)</option>
            <option value="1000x1000">Mercari (1000x1000)</option>
            <option value="1024x1024">Facebook Marketplace (1024x1024)</option>
          </select>
        </div>
        <button class="btn" id="applyBtn">Apply</button>
      </div>
      <div class="info-bar" id="infoBar" style="display:none"></div>
      <div class="preview-area" id="previewArea"></div>
      <div id="downloadArea" style="margin-top:16px"></div>
    </main>
  </div>
  <script src="../js/app.js"></script>
  <script>
    let srcCanvas = null;

    createDropzone(document.getElementById('dropzoneArea'), async (file) => {
      srcCanvas = await fileToCanvas(file);
      document.getElementById('controls').style.display = 'flex';
      document.getElementById('infoBar').style.display = 'flex';
      document.getElementById('infoBar').textContent = `Source: ${srcCanvas.width} x ${srcCanvas.height}`;
      showPreview(document.getElementById('previewArea'), srcCanvas.toDataURL());
      document.getElementById('downloadArea').innerHTML = '';
    });

    document.getElementById('applyBtn').addEventListener('click', async () => {
      const [tw, th] = document.getElementById('preset').value.split('x').map(Number);
      const out = document.createElement('canvas');
      out.width = tw; out.height = th;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, tw, th);
      const padding = Math.min(tw, th) * 0.1;
      const maxW = tw - padding * 2;
      const maxH = th - padding * 2;
      const srcRatio = srcCanvas.width / srcCanvas.height;
      const dstRatio = maxW / maxH;
      let dw, dh;
      if (srcRatio > dstRatio) {
        dw = maxW;
        dh = maxW / srcRatio;
      } else {
        dh = maxH;
        dw = maxH * srcRatio;
      }
      const dx = (tw - dw) / 2;
      const dy = (th - dh) / 2;
      ctx.drawImage(srcCanvas, dx, dy, dw, dh);
      showPreview(document.getElementById('previewArea'), out.toDataURL());
      const blob = await new Promise(r => out.toBlob(r, 'image/png'));
      const f = new File([blob], 'marketplace.png', { type: 'image/png' });
      document.getElementById('downloadArea').innerHTML = '';
      addDownloadButton(document.getElementById('downloadArea'), f, 'marketplace.png');
    });
  </script>
</body>
</html>
