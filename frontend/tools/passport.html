<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passport / ID Photo - PhotoTools</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="../index.html">PHOTO TOOLS</a> / Passport / ID Photo</h1>
    </header>
    <main class="tool-page">
      <div id="dropzoneArea"></div>
      <div class="controls" id="controls" style="display:none; flex-direction:column; gap:16px">
        <div style="display:flex; gap:16px; flex-wrap:wrap">
          <div><label>Standard</label><br>
          <select id="preset">
            <option value="600x600">US Passport (2x2 in)</option>
            <option value="420x525">UK Passport (35x45mm)</option>
            <option value="413x531">EU / Visa (35x45mm)</option>
            <option value="358x441">China ID (26x32mm)</option>
            <option value="350x450">India Passport (3.5x4.5cm)</option>
            <option value="600x600">Square ID</option>
          </select></div>
          <div><label>Background</label><br>
          <select id="bgType">
            <option value="white">White</option>
            <option value="blue">Blue</option>
          </select></div>
          <div><label>Head Size (%)</label><br>
          <input type="range" id="headSize" min="40" max="80" value="60"></div>
        </div>
        <div>
          <button class="btn" id="applyBtn">Create Photo</button>
        </div>
      </div>
      <div class="info-bar" id="infoBar" style="display:none"></div>
      <div class="preview-area" id="previewArea"></div>
      <div id="downloadArea" style="margin-top:16px"></div>
    </main>
  </div>
  <script src="../js/app.js"></script>
  <script>
    let srcCanvas = null;

    createDropzone(document.getElementById('dropzoneArea'), async (file) => {
      srcCanvas = await fileToCanvas(file);
      document.getElementById('controls').style.display = 'flex';
      document.getElementById('infoBar').style.display = 'flex';
      document.getElementById('infoBar').textContent = `Source: ${srcCanvas.width} x ${srcCanvas.height}`;
      showPreview(document.getElementById('previewArea'), srcCanvas.toDataURL());
      document.getElementById('downloadArea').innerHTML = '';
    });

    document.getElementById('applyBtn').addEventListener('click', async () => {
      const [tw, th] = document.getElementById('preset').value.split('x').map(Number);
      const bgColor = document.getElementById('bgType').value === 'blue' ? '#438edb' : '#ffffff';
      const headPct = parseInt(document.getElementById('headSize').value) / 100;

      const out = document.createElement('canvas');
      out.width = tw; out.height = th;
      const ctx = out.getContext('2d');

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, tw, th);

      const srcRatio = srcCanvas.width / srcCanvas.height;
      const dstRatio = tw / th;
      let sx, sy, sw, sh;
      if (srcRatio > dstRatio) { sh = srcCanvas.height; sw = sh * dstRatio; sx = (srcCanvas.width - sw) / 2; sy = 0; }
      else { sw = srcCanvas.width; sh = sw / dstRatio; sx = 0; sy = (srcCanvas.height - sh) / 2; }

      const dw = tw * headPct;
      const dh = th * headPct;
      const dx = (tw - dw) / 2;
      const dy = (th - dh) / 2 - th * 0.05;

      ctx.drawImage(srcCanvas, sx, sy, sw, sh, dx, dy, dw, dh);

      showPreview(document.getElementById('previewArea'), out.toDataURL());
      const blob = await new Promise(r => out.toBlob(r, 'image/png'));
      const f = new File([blob], 'passport-photo.png', { type: 'image/png' });
      document.getElementById('downloadArea').innerHTML = '';
      addDownloadButton(document.getElementById('downloadArea'), f, 'passport-photo.png');
    });
  </script>
</body>
</html>
