<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Presets - PhotoTools</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="../index.html">PHOTO TOOLS</a> / Social Media Presets</h1>
    </header>
    <main class="tool-page">
      <div id="dropzoneArea"></div>
      <div class="controls" id="controls" style="display:none">
        <div>
          <label>Platform</label><br>
          <select id="preset">
            <option value="1080x1080">Instagram Post (1080x1080)</option>
            <option value="1080x1920">Instagram Story (1080x1920)</option>
            <option value="1080x1920">TikTok Thumbnail (1080x1920)</option>
            <option value="1280x720">YouTube Thumbnail (1280x720)</option>
            <option value="820x312">Facebook Cover (820x312)</option>
            <option value="1000x1500">Pinterest Pin (1000x1500)</option>
            <option value="1500x500">X/Twitter Header (1500x500)</option>
            <option value="1584x396">LinkedIn Banner (1584x396)</option>
          </select>
        </div>
        <button class="btn" id="applyBtn">Apply</button>
      </div>
      <div class="info-bar" id="infoBar" style="display:none"></div>
      <div class="preview-area" id="previewArea"></div>
      <div id="downloadArea" style="margin-top:16px"></div>
    </main>
  </div>
  <script src="../js/app.js"></script>
  <script>
    let srcCanvas = null;

    createDropzone(document.getElementById('dropzoneArea'), async (file) => {
      srcCanvas = await fileToCanvas(file);
      document.getElementById('controls').style.display = 'flex';
      document.getElementById('infoBar').style.display = 'flex';
      document.getElementById('infoBar').textContent = `Source: ${srcCanvas.width} x ${srcCanvas.height}`;
      showPreview(document.getElementById('previewArea'), srcCanvas.toDataURL());
      document.getElementById('downloadArea').innerHTML = '';
    });

    document.getElementById('applyBtn').addEventListener('click', async () => {
      const [tw, th] = document.getElementById('preset').value.split('x').map(Number);
      const out = document.createElement('canvas');
      out.width = tw; out.height = th;
      const ctx = out.getContext('2d');
      const srcRatio = srcCanvas.width / srcCanvas.height;
      const dstRatio = tw / th;
      let sx, sy, sw, sh;
      if (srcRatio > dstRatio) {
        sh = srcCanvas.height;
        sw = sh * dstRatio;
        sx = (srcCanvas.width - sw) / 2;
        sy = 0;
      } else {
        sw = srcCanvas.width;
        sh = sw / dstRatio;
        sx = 0;
        sy = (srcCanvas.height - sh) / 2;
      }
      ctx.drawImage(srcCanvas, sx, sy, sw, sh, 0, 0, tw, th);
      showPreview(document.getElementById('previewArea'), out.toDataURL());
      const blob = await new Promise(r => out.toBlob(r, 'image/png'));
      const f = new File([blob], 'social-media.png', { type: 'image/png' });
      document.getElementById('downloadArea').innerHTML = '';
      addDownloadButton(document.getElementById('downloadArea'), f, 'social-media.png');
    });
  </script>
</body>
</html>
